name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  backend:
    name: API + queues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Apply pending D1 migrations first; a failure here stops the deploy.
      - name: D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy API
        working-directory: apps/api
        run: npx wrangler deploy

      - name: Deploy queues consumer
        working-directory: apps/queues
        run: npx wrangler deploy

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    needs: backend # UI only goes live once the API it talks to is updated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          VITE_API_URL: https://api.raxteam.com
          VITE_SA_PATH: ${{ secrets.VITE_SA_PATH }}
        run: npm run build

      - name: Deploy to Pages
        working-directory: apps/dashboard
        run: npx wrangler pages deploy dist --project-name skillmesh-dashboard --branch production
